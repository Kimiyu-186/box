# Rendered by demo.sh: <DEMO> becomes the scratch directory, <DEVELOPER_DIR> the macOS developer
# tools (`xcode-select -p`), <CARGO> the operator's cargo, and <RUSTUP_HOME> its toolchains.
# <SDKROOT> is the macOS SDK, so rustc does not run xcrun to find it. <AGENT_SCRIPT> is the script
# for this run.
name = "packs-demo-temporal"
box_dir = "<DEMO>/state"
policy = "policy.dw"
packs = ["git.pack.toml", "cargo.pack.toml"]

[agent]
command = ["/bin/bash", "<AGENT_SCRIPT>"]
workspace = "<DEMO>/work/repo"
env = { PATH = "/usr/bin:/bin", HOME = "<DEMO>/home", TERM = "dumb" }

[agent.filesystem]
read = ["<DEMO>/config"]
write_file = ["<DEMO>/work/repo/verdict.txt"]

[tool.git]
command = ["/usr/bin/git"]
env = { HOME = "<DEMO>/home", DEVELOPER_DIR = "<DEVELOPER_DIR>", TMPDIR = "<DEMO>/tmp" }

[tool.git.filesystem]
read = ["<DEMO>/work", "<DEMO>/home", "<DEVELOPER_DIR>", "<DEMO>/tmp"]
write = ["<DEMO>/work", "<DEMO>/tmp"]

[tool.cargo]
command = ["<CARGO>"]
env = { HOME = "<DEMO>/home", PATH = "<CARGO_BIN>:/usr/bin:/bin", CARGO_HOME = "<DEMO>/cargo-home", RUSTUP_HOME = "<RUSTUP_HOME>", CARGO_TARGET_DIR = "<DEMO>/target", TMPDIR = "<DEMO>/tmp", DEVELOPER_DIR = "<DEVELOPER_DIR>", SDKROOT = "<SDKROOT>", CARGO_NET_OFFLINE = "true", CARGO_TERM_COLOR = "never" }

[tool.cargo.filesystem]
read = ["<DEMO>/work", "<DEMO>/home", "<CARGO_BIN>", "<RUSTUP_HOME>", "<DEVELOPER_DIR>", "<DEMO>/cargo-home", "<DEMO>/target", "<DEMO>/tmp"]
write = ["<DEMO>/work/repo", "<DEMO>/cargo-home", "<DEMO>/target", "<DEMO>/tmp"]
