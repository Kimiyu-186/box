# Rendered by demo.sh: <DEMO> becomes the scratch directory, and <DEVELOPER_DIR> the macOS developer
# tools that the /usr/bin/git shim runs (`xcode-select -p`).
name = "packs-demo-git"
box_dir = "<DEMO>/state"
policy = "policy.dw"
packs = ["git.pack.toml"]

[agent]
command = ["/bin/bash", "-c", """
zsh -c 'git status --short --branch; echo "git status exit=$?"'
zsh -c 'git push origin main; echo "git push exit=$?"'
zsh -c 'git log --oneline -1; echo "git log (unmodeled) exit=$?"'
"""]
workspace = "<DEMO>/work/repo"
env = { PATH = "/usr/bin:/bin", HOME = "<DEMO>/home", TERM = "dumb" }

[tool.git]
command = ["/usr/bin/git"]
env = { HOME = "<DEMO>/home", DEVELOPER_DIR = "<DEVELOPER_DIR>" }

[tool.git.filesystem]
read = ["<DEMO>/work", "<DEMO>/home", "<DEVELOPER_DIR>"]
write = ["<DEMO>/work"]
