# Rendered by demo.sh: <DEMO> becomes the scratch directory, <TOOLCHAIN> the rustup toolchain
# directory that `rustup which cargo` names, and the AGENT_SCRIPT marker the commands to run.
# The pack is the full example pack, examples/packs/cargo.pack.toml.
name = "packs-demo-cargo"
box_dir = "<DEMO>/state"
policy = "policy.dw"
tool_packs = ["cargo.pack.toml"]

[agent]
command = ["/bin/bash", "-c", '''
run() { zsh -c "$1"; echo "    -> exit=$? : $1"; }
<AGENT_SCRIPT>
''']
workspace = "<DEMO>/work/hello"
env = { PATH = "/usr/bin:/bin", HOME = "<DEMO>/home", TERM = "dumb" }

# The toolchain's own cargo, not the rustup proxy: `run` starts with <TOOLCHAIN>/bin first on PATH,
# so the box's shell resolves `cargo` to this file. CARGO_HOME is a scratch directory, so the
# tool never reaches the operator's ~/.cargo.
[tool.cargo]
command = ["<TOOLCHAIN>/bin/cargo"]
env = { HOME = "<DEMO>/home", CARGO_HOME = "<DEMO>/cargo-home", RUSTC = "<TOOLCHAIN>/bin/rustc", TMPDIR = "<DEMO>/tmp" }

[tool.cargo.filesystem]
read = ["<DEMO>/work", "<DEMO>/cargo-home", "<DEMO>/tmp", "<TOOLCHAIN>"]
write = ["<DEMO>/work", "<DEMO>/cargo-home", "<DEMO>/tmp"]
